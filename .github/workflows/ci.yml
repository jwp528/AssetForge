name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore AssetForge.slnx --configfile NuGet.Config
      - run: dotnet build AssetForge.slnx -c Release --no-restore
      - run: dotnet test AssetForge.slnx -c Release --no-build --logger "console;verbosity=normal"
